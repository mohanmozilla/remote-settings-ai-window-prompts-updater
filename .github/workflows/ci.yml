name: Run CI checks

on: pull_request

jobs:
  run_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check workflow files
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
        shell: bash
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Lint
        run: make lint

  run_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Test
        run: make test

  test_load:
    runs-on: ubuntu-latest
    env:
      SERVER: "http://localhost:8888/v1"
      GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build ingestion job container
        run:
          docker build -t cronjob:test .
      - name: Run local Remote Settings server
        run: |
          docker run --detach \
            --network=host \
            --env KINTO_INI=config/testing.ini \
            mozilla/remote-settings
      - name: Wait for Remote Settings server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8888/v1/ && break
            echo "Waiting for server... ($i)"
            sleep 1
          done
      - name: Create collection
        run: |
          curl -X PUT http://localhost:8888/v1/buckets/main-workspace/collections/ai-window-prompts

      - name: Run job from container
        run: |
          docker run -e SERVER="${SERVER}" \
            -e GIT_TOKEN="${GIT_TOKEN}" \
            --network=host \
            cronjob:test

      - name: Run job from source
        run: make start
